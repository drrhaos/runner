name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Release signing secrets are not configured."
            echo "Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to repository secrets."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

          {
            echo "storeFile=release.keystore"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > keystore.properties

      - name: Extract version from tag
        run: |
          VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          IFS='.' read -r major minor patch <<< "$VERSION_NAME"
          minor="${minor:-0}"
          patch="${patch:-0}"
          major="${major:-0}"

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${{ env.VERSION_NAME }}" \
            -PversionCode="${{ env.VERSION_CODE }}" \
            --stacktrace

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk "release-artifacts/runner-${{ env.VERSION_NAME }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Runner ${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: release-artifacts/*.apk
